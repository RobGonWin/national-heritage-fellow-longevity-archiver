[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "national-heritage-fellow-longevity-archiver"
version = "0.1.0"
requires-python = ">=3.12"
description = "Independent public source-bound NEA archival comparison"
dependencies = []
[project.scripts]
nea-archiver = "nea_archiver.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
